name: Update repository counter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_PAT"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          user = get_json("https://api.github.com/user")
          username = user["login"]

          repos = []
          page = 1

          while True:
              url = (
                  "https://api.github.com/user/repos"
                  f"?visibility=all&affiliation=owner"
                  f"&per_page=100&page={page}"
              )
              batch = get_json(url)
              repos.extend(batch)

              if len(batch) < 100:
                  break
              page += 1

          total = len(repos)
          public = sum(not r["private"] for r in repos)
          private = sum(r["private"] for r in repos)

          print(f"Account: {username}")
          print(f"Total: {total}")
          print(f"Public: {public}")
          print(f"Private: {private}")

          badge = (
              f"![Total Repositories]"
              f"(https://img.shields.io/badge/"
              f"Total_Repos-{total}-blue"
              f"?style=for-the-badge&logo=github)"
          )

          path = "README.md"
          with open(path, encoding="utf-8") as f:
              readme = f.read()

          start = "<!-- REPO_COUNT_START -->"
          end = "<!-- REPO_COUNT_END -->"

          if start not in readme or end not in readme:
              raise ValueError("README markers are missing")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)

          updated = before + start + "\n" + badge + "\n" + end + after

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update repository counter"
          git push
